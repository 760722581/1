name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --x64 -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-Windows-x64
          path: |
            dist/*.exe
            Windows使用说明.txt
          if-no-files-found: error
          retention-days: 30
